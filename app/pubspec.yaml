name: codeci_app
description: "CoDeCi: Collecte de déchets en Côte d'Ivoire."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8

  image_picker: ^1.1.2
  geolocator: ^13.0.1
  http: ^1.2.2

  connectivity_plus: ^6.0.5   # détection en ligne / hors-ligne
  hive: ^2.2.3                # stockage local de la file d'attente
  hive_flutter: ^1.1.0        # intégration Hive <-> cycle de vie Flutter
  path_provider: ^2.1.4       # (déjà souvent tiré par image_picker, mais utile en direct)
  uuid: ^4.5.1                # génération d'identifiants uniques pour chaque signalement
  flutter_secure_storage: ^9.2.2   # stockage chiffré du token JWT
  mapbox_maps_flutter: ^2.0.0       # navigation chauffeur (carte + itinéraire)

dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0

  flutter_launcher_icons: ^0.14.1

flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#1F4B4A"
  adaptive_icon_foreground: "assets/icon/icon.png"

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: "assets/icon/icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#1F4B4A"
  adaptive_icon_foreground: "assets/icon/icon.png"